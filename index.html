.toast {

.toast.show {
  opacity: 1;

<body>
<main class="poster-wrap" style="max-width:760px;padding:28px 18px 42px;line-height:1.4;font-family:Arial,'Noto Sans KR',sans-serif;">
  <section style="background:linear-gradient(180deg,#07113a 0%,#02072a 100%);border:2px solid #1f2b69;border-radius:28px;padding:36px 28px;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.35);">

      <div style="font-size:clamp(28px,6vw,46px);font-weight:800;letter-spacing:-1px;margin-bottom:18px;">기업은행 528-056314-04-014</div>
      <div style="color:#aeb5cf;font-size:clamp(20px,4.4vw,31px);margin-bottom:26px;">주식회사 파이티로</div>
      <button type="button" onclick="copyAccount()" style="width:100%;border:0;border-radius:18px;padding:20px 18px;font-size:clamp(19px,4vw,28px);font-weight:800;background:#fff;color:#07113a;cursor:pointer;">계좌번호 복사</button>
    </div>
  </section>
</main>

<div id="toast" class="toast">계좌번호가 복사되었습니다.</div>

<script>
async function copyAccount(){
  const text = '528-056314-04-014';
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const toast=document.getElementById('toast');
  toast.textContent='계좌번호가 복사되었습니다.';
  toast.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer=setTimeout(()=>toast.classList.remove('show'),1800);
}
</script>

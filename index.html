<title>GRANO 입금 계좌 및 지갑 안내</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
  }
  .poster-wrap {
    position: relative;
    width: 100%;
    max-width: 658px;
    margin: 0 auto;
    line-height: 0;
    overflow: hidden;
  }
  .poster {
    display: block;
    width: 100%;
    height: auto;
  }
  .bank-name {
    position: absolute;
    left: 7.6%;
    top: 36.15%;
    z-index: 5;
    color: #d7aa4f;
    font-family: Arial, "Noto Sans KR", sans-serif;
    font-size: clamp(12px, 2.35vw, 16px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.3px;
    white-space: nowrap;
    pointer-events: none;
  }
  .copy-button {
    position: absolute;
    z-index: 10;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
  }
  .account-copy {
    left: 65.4%;
    top: 34.3%;
    width: 28.2%;
    height: 9.7%;
  }
  .wallet-copy {
    left: 65.4%;
    top: 58.0%;
    width: 28.2%;
    height: 9.7%;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    z-index: 9999;
    transform: translate(-50%, 14px);
    padding: 11px 18px;
    border: 1px solid #c99b39;
    border-radius: 999px;
    background: rgba(15,15,15,.96);
    color: #ffe6a3;
    font: 700 14px/1.2 Arial, "Noto Sans KR", sans-serif;
    white-space: nowrap;
    opacity: 0;
    visibility: hidden;
    transition: .2s ease;
    pointer-events: none;
  }
  .toast.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, 0);
  }
</style>

<script>
async function copyText(text, message) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const temp = document.createElement('textarea');
    temp.value = text;
    temp.setAttribute('readonly', '');
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.select();
    document.execCommand('copy');
    temp.remove();
  }

  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1700);
}
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GRANO | 공식 입금 안내</title>
<meta name="description" content="GRANO 공식 입금 계좌 안내">
<link rel="canonical" href="https://hyo827111-cell.github.io/grano/">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#050505;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:24px 14px 44px;
  background:
    radial-gradient(circle at 50% -10%, rgba(205,158,56,.18), transparent 28%),
    linear-gradient(180deg,#050505 0%,#0a0a0a 100%);
}
.wrap{
  width:min(100%,680px);
  position:relative;
}
.card{
  position:relative;
  overflow:hidden;
  border:1px solid rgba(214,166,67,.65);
  border-radius:26px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.02),rgba(255,255,255,0)),
    #090909;
  box-shadow:
    0 0 0 1px rgba(255,211,111,.05) inset,
    0 24px 70px rgba(0,0,0,.45),
    0 0 38px rgba(183,131,34,.12);
}
.card:before,
.card:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  filter:blur(50px);
  opacity:.16;
  pointer-events:none;
}
.card:before{background:#d6a643;top:-90px;right:-70px}
.card:after{background:#7b5310;bottom:-100px;left:-80px}
.header{
  padding:32px 28px 24px;
  text-align:center;
  border-bottom:1px solid rgba(214,166,67,.28);
}
.brand{
  color:#d9ad52;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(30px,7vw,48px);
  font-weight:700;
  letter-spacing:3px;
  text-shadow:0 0 18px rgba(218,171,78,.18);
}
.sub{
  margin-top:8px;
  color:#8f7643;
  font-size:12px;
  letter-spacing:4px;
}
.title{
  margin:26px 0 0;
  color:#f3ead8;
  font-size:clamp(24px,5vw,36px);
  font-weight:800;
}
.content{
  padding:26px 20px 24px;
}
.account-box{
  border:1px solid rgba(214,166,67,.42);
  border-radius:22px;
  padding:22px 20px;
  background:linear-gradient(180deg,#101010 0%,#0b0b0b 100%);
  position:relative;
}
.label{
  color:#cda34f;
  font-size:14px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:12px;
}
.bank{
  color:#f7f2e8;
  font-size:clamp(22px,5vw,31px);
  font-weight:800;
  margin-bottom:12px;
}
.account{
  color:#fff;
  font-size:clamp(26px,6vw,39px);
  font-weight:900;
  letter-spacing:-.6px;
  word-break:keep-all;
  margin-bottom:14px;
}
.holder{
  color:#bcb4a4;
  font-size:clamp(17px,4vw,22px);
  margin-bottom:22px;
}
.copy-btn{
  width:100%;
  border:1px solid #e3b452;
  border-radius:16px;
  padding:17px 18px;
  background:linear-gradient(180deg,#e0b04e 0%,#b9801f 100%);
  color:#16100a;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 5px 18px rgba(197,142,37,.24),
    inset 0 1px 0 rgba(255,255,255,.38);
}
.copy-btn:active{transform:translateY(1px)}
.notice{
  margin-top:18px;
  color:#8d8473;
  text-align:center;
  font-size:13px;
  line-height:1.55;
}
.footer{
  padding:18px 20px 22px;
  text-align:center;
  color:#7d6b48;
  font-size:12px;
  letter-spacing:.3px;
}
.toast{
  position:fixed;
  left:50%;
  bottom:28px;
  z-index:999;
  transform:translate(-50%,18px);
  padding:12px 18px;
  border:1px solid #c99a3a;
  border-radius:999px;
  background:rgba(10,10,10,.96);
  color:#ffe8ae;
  font-size:14px;
  font-weight:800;
  opacity:0;
  visibility:hidden;
  transition:.2s ease;
  white-space:nowrap;
}
.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <div class="header">
      <div class="brand">GRANO</div>
      <div class="sub">PREMIUM PAYMENT GUIDE</div>
      <div class="title">입금 안내</div>
    </div>

    <div class="content">
      <div class="account-box">
        <div class="label">BANK ACCOUNT</div>
        <div class="bank">기업은행</div>
        <div class="account">528-056314-04-014</div>
        <div class="holder">예금주 : 주식회사 파이티로</div>

        <button class="copy-btn" type="button" onclick="copyAccount()">
          계좌번호 복사
        </button>
      </div>

      <div class="notice">
        입금 전 계좌번호와 예금주를 다시 한 번 확인해 주세요.
      </div>
    </div>

    <div class="footer">GRANO PLATFORM</div>
  </section>
</main>

<div id="toast" class="toast">계좌번호가 복사되었습니다.</div>

<script>
async function copyAccount(){
  const text='528-056314-04-014';
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  const toast=document.getElementById('toast');
  toast.textContent='계좌번호가 복사되었습니다.';
  toast.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1700);
}
</script>
</body>
</html>

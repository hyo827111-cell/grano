<title>GRANO 입금 계좌 및 지갑 안내</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #000;
}

.poster-wrap {
  position: relative;
  width: 100%;
  max-width: 1024px;
  margin: 0 auto;
  line-height: 0;
}

.poster {
  display: block;
  width: 100%;
  height: auto;
}

.copy-area {
  position: absolute;
  z-index: 10;
  border: 0;
  padding: 0;
  margin: 0;
  background: transparent;
  cursor: pointer;
}

/* 이미지 안의 '계좌번호 복사' 버튼 영역 */
.bank-copy {
  left: 65.9%;
  top: 36.0%;
  width: 27.6%;
  height: 8.8%;
}

/* 이미지 안의 '지갑주소 복사' 버튼 영역 */
.wallet-copy {
  left: 65.9%;
  top: 59.8%;
  width: 27.6%;
  height: 8.9%;
}

.copy-area:focus-visible {
  outline: 3px solid #fff;
  outline-offset: -4px;
  border-radius: 18px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  z-index: 9999;
  transform: translate(-50%, 18px);
  padding: 12px 20px;
  border: 1px solid #d8a52c;
  border-radius: 999px;
  background: rgba(20,20,20,.96);
  color: #fff0b4;
  font: 700 14px Arial, "Noto Sans KR", sans-serif;
  line-height: 1.2;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: .2s ease;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}
</style>

    onclick="copyText('0x45c8F18102f52035E26365D626C9ac65b2D8704A')"
  ></button>
</main>

<div id="toast" class="toast">복사되었습니다.</div>

<script>
let toastTimer;

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      fallbackCopy(text);
    }
    showToast("복사되었습니다.");
  } catch (error) {
    try {
      fallbackCopy(text);
      showToast("복사되었습니다.");
    } catch (secondError) {
      showToast("복사하지 못했습니다.");
    }
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement("textarea");
  textarea.value = text;
  textarea.setAttribute("readonly", "");
  textarea.style.position = "fixed";
  textarea.style.left = "-9999px";
  textarea.style.opacity = "0";

  document.body.appendChild(textarea);
  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0, textarea.value.length);

  const copied = document.execCommand("copy");
  document.body.removeChild(textarea);

  if (!copied) throw new Error("copy failed");
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
}
</script>

</body>
</html>

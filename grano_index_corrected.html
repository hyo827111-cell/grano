<script>
async function copyText(text,message){
try{await navigator.clipboard.writeText(text)}catch(e){
const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.focus();area.select();document.execCommand('copy');area.remove()
}
const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>toast.classList.remove('show'),1700)
}
</script>
